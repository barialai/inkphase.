<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staking form — Inkphase</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b0915;color:#e5e3ef;font:12px/1.4 Inter,Arial,sans-serif}body{display:grid;place-items:center;min-height:100vh;padding:13px}.staking{position:relative;width:min(100%,289px);padding:13px 11px 15px;border:1px solid #424050;border-radius:19px;background:radial-gradient(ellipse at 51% 120%,#252071,#0b0918 55%,#10101b 100%);box-shadow:0 17px 35px #0008,0 14px 24px -12px #6247ff,0 13px 14px -10px #16d9ff,inset 0 1px #ffffff13}.staking:after{content:"";pointer-events:none;position:absolute;inset:auto 13px -2px;border-radius:50%;height:8px;background:#67c7ff;filter:blur(8px)}.label{display:block;color:#c4c0cf;font-size:11px;margin-bottom:7px}.amount{height:72px;padding:12px 10px 8px;border:1px solid #22212e;border-radius:12px;background:linear-gradient(140deg,#171620,#23222e 70%,#191a24);box-shadow:0 7px 16px #0006,inset 0 1px #ffffff0a}.amount-top,.amount-bottom,.balance,.period-head,.year,.renew{display:flex;justify-content:space-between;align-items:center}.amount-top strong{font-size:21px;font-weight:400;line-height:1}.coin{display:flex;align-items:center;gap:5px;color:#a4a2b2}.coin i{width:15px;height:15px;border-radius:50%;background:#383944;text-align:center;font-size:9px;font-style:normal;color:#e0e0ea;line-height:15px}.amount-bottom{color:#7e7b8b;font-size:10px;margin-top:10px}.amount-bottom em,.amount-bottom b{font-style:normal;font-weight:400;padding:2px 5px;border-radius:3px;background:#2a2a35}.amount-bottom b{color:#d94539;background:#3b2128}.balance{font-size:10px;color:#c0bdcc;margin:10px 0 12px}.deposit{padding:3px 8px;border:1px solid #6335c8;border-radius:8px;background:#201332;color:#ddd8ed;font:10px Inter,Arial,sans-serif}.deposit span{margin-right:6px;font-size:13px}hr{border:0;border-top:1px solid #242033;margin:0 0 10px}.period-head{color:#c0bdcc;font-size:11px;margin-bottom:10px}.period-head span{border:1px solid #777487;border-radius:50%;width:12px;height:12px;text-align:center;line-height:10px;font-size:9px}.period{border-radius:12px;background:linear-gradient(150deg,#171524,#262247 65%,#39307b);padding:10px 10px 8px;box-shadow:inset 0 1px #ffffff0a}.year{font-size:11px;margin-bottom:12px}.year small{font-size:9px;color:#8c86ad;margin-left:auto;margin-right:5px}.year strong{font-size:13px;color:#02dbb8}.renew{font-size:10px;margin-bottom:5px}.toggle{position:relative;border:0;width:27px;height:15px;border-radius:20px;background:#ffdc20;padding:0}.toggle:after{content:"";position:absolute;right:2px;top:2px;width:11px;height:11px;border-radius:50%;background:#fff}.note{max-width:235px;color:#8884a5;font-size:9px;line-height:1.45}
</style></head><body><main class="staking" aria-label="Staking form design element"><label class="label">Deposit amount</label><div class="amount"><div class="amount-top"><strong>100</strong><span class="coin"><i>₮</i> USDT</span></div><div class="amount-bottom"><span><em>Min</em> &nbsp;$2</span><b>Max</b></div></div><div class="balance"><span>Balance 110.141 USDT</span><button class="deposit" type="button"><span>▣</span>Deposit</button></div><hr><div class="period-head">Staking period <span>ⓘ</span></div><div class="period"><div class="year">1 year <small>APY</small><strong>25%</strong></div><div class="renew">Auto-renew <button class="toggle" type="button" role="switch" aria-label="Auto-renew" aria-checked="true" onclick="this.setAttribute('aria-checked',this.getAttribute('aria-checked')==='true'?'false':'true')"></button></div><div class="note">Your balance will be auto-restaked into the same plan at maturity.</div></div></main></body></html>
